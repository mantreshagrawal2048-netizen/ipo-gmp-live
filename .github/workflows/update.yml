name: Update IPO GMP data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pandas lxml playwright
          playwright install --with-deps chromium
      - name: Fetch GMP data
        run: python scraper.py
      - name: Commit updated data
        run: |
          git config user.name "gmp-bot"
          git config user.email "gmp-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update GMP data" && git push)
